# Loctree IntelliJ plugin — Gradle configuration
#
# 𝚅𝚒𝚋𝚎𝚌𝚛𝚊𝚏𝚝𝚎𝚍. with AI Agents ⓒ 2025-2026 Vetcoders

# Plugin coordinates
pluginGroup = io.loct.intellij
pluginVersion = 0.14.5-rc1

# Plugin id must stay stable across releases (Marketplace identity).
pluginId = io.loct.loctree

# Native LSP API lives in com.intellij.modules.lsp for 2025.2.1+ IDEs.
pluginSinceBuild = 252.1
# Empty means no explicit upper IDE compatibility gate in the final descriptor.
pluginUntilBuild =

# Target a modern IntelliJ IDEA build for the native LSP API surface.
platformType = IU
platformVersion = 2026.1.3

# Build environment
kotlin.stdlib.default.dependency = false
org.gradle.configuration-cache = false
org.gradle.caching = true
org.gradle.jvmargs = -Xmx2g -XX:+UseParallelGC -Dfile.encoding=UTF-8
